version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regression-api
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: regression-ui
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      API_URL: http://api:8000/predict
